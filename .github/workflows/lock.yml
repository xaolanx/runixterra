name: lock updater

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual update)"
        required: false
        default: "false"
  schedule:
    - cron: "0 0 * * 0" # Sunday
    - cron: "0 0 * * 1-6" # Monday–Saturday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          extra-conf: |
            lazy-trees = true

      - name: Clear Cachix
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
        run: |
          echo "Clearing Cachix cache"
          curl -X 'POST' \
            'https://app.cachix.org/api/v1/cache/xaolan/clear' \
            -H 'accept: application/json;charset=utf-8' \
            -H 'Authorization: Bearer ${{ secrets.CACHIX_AUTH_TOKEN }}' \
            -d ''

      - name: Install npins
        run: nix-env -f https://github.com/andir/npins/archive/master.tar.gz -i

      - name: Nightly npins update
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1-6')
        id: nightly
        uses: getchoo/update-npins@v0.1.2
        with:
          commit-message: "chore(lockfile): nightly update"
          pr-labels: |
            dependencies
            automated
            nightly

      - name: Weekly npins update
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
        id: weekly
        uses: getchoo/update-npins@v0.1.2
        with:
          commit-message: "chore(lockfile): nightly update"
          pr-labels: |
            dependencies
            automated
            weekly

      # - name: Auto-merge PR
      #   if: steps.nightly.outputs.pull-request-number || steps.weekly.outputs.pull-request-number
