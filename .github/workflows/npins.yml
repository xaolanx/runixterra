name: npins updater

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual update)"
        required: false
        default: "false"
  schedule:
    - cron: "0 5 * * 0" # Sunday
    - cron: "0 5 * * 1-6" # Monday–Saturday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chore-npins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          extra-conf: |
            lazy-trees = true

      - name: Install npins
        #run: nix-env -f https://github.com/andir/npins/archive/master.tar.gz -i
        run: nix profile add nixpkgs#npins

      - name: Nightly npins update
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1-6')
        id: nightly
        uses: getchoo/update-npins@v0.1.2
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "chore(lockfile): nightly update"
          npins-directory: "./parts/npins"
          pr-branch: "npins-nightly"
          pr-target: "rum"
          pr-labels: |
            dependencies
            automated
            nightly

      - name: Weekly npins update
        if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * 0'
        id: weekly
        uses: getchoo/update-npins@v0.1.2
        with:
          token: ${{ secrets.GH_TOKEN }}
          commit-message: "chore(lockfile): weekly update"
          npins-directory: "./parts/npins"
          pr-branch: "npins-weekly"
          pr-target: "rum"
          pr-labels: |
            dependencies
            automated
            weekly

      # - name: Auto-merge PR
      #   if: steps.nightly.outputs.pull-request-number || steps.weekly.outputs.pull-request-number
      #   run: |
      #     PR_NUMBER="${{ steps.nightly.outputs.pull-request-number || steps.weekly.outputs.pull-request-number }}"
      #     echo "Merging PR #$PR_NUMBER"
      #     gh pr merge "$PR_NUMBER" --squash --auto
